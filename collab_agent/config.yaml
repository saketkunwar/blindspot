# collab_agent/config.yaml — version 2.
# Preregistered 2026-10-31; every value's reason lives in QUESTIONS.md
# ("Morning-brief triggers"). Changing a value is a versioned amendment
# with the reason recorded there, never a quiet retune.
# Version 2 ADDS the manners block (operator-approved, before the first
# guarded run): the daemon never nags, never briefs from a moved store,
# and never crashes on an unreadable digest. Reads stay read-only.
version: 2
manners:
  # Same-date rerun: report the cooldown and write nothing. The daemon
  # runs once per morning; a second run the same day is a nag, not news.
  cooldown_same_date: true
  # Fingerprint the memory store before the run and re-read it after.
  # A moved store means the brief would speak from stale numbers, so the
  # run stays silent instead. Mirrors the stale-dossier guard pattern.
  fingerprint_store: true
study_box:
  # The box the October 30 pull verified against (see _live_snapshot's
  # bbox_check in scripts/make_demo2.py). FIRMS wants west,south,east,north.
  west: 112.00347
  south: -2.99993
  east: 114.99982
  north: -0.01536
firms:
  source: VIIRS_NOAA20_NRT
  day_range: 5
  key_env:
    - FIRMS_MAP_KEY
    - NASA_FIRMS_MAP_KEY
triggers:
  # (a) spike: today >= spike_multiple x trailing median over trailing_days
  spike_multiple: 2.0
  trailing_days: 4
  # (d) quiet: today < quiet_max after a matched-pattern yesterday
  quiet_max: 3
  # (c) memory speaks at this many labelled cases under one signature
  speak_bar: 5
